    <script>
        const qa = [
            { q: "1. Характеристики качества ПО", a: "Согласно ГОСТ Р ИСО/МЭК 25010, основными характеристиками являются: функциональная полнота (способность выполнять заявленные функции), производительность (время отклика, использование ресурсов), совместимость (способность обмениваться информацией с другими системами), удобство использования (понятность, изучаемость), надежность (безотказность, восстанавливаемость), безопасность (защита информации), сопровождаемость (удобство modification), мобильность (переносимость)." },
            { q: "2. Виды стандартов (характеристика)", a: "Вид стандарта определяется объектом стандартизации (ГОСТ Р 1.0) :\n•\tОсновополагающие: имеют широкую область распространения, содержат общие положения (организационно-методические и общетехнические).\n•\tНа продукцию: требования к группе однородной продукции (стандарт общих технических условий) или к конкретной продукции (стандарт технических условий).\n•\tНа процессы (работы): требования к выполнению работ на этапах жизненного цикла (разработка, производство, эксплуатация).\n•\tНа услуги: требования к группе однородных услуг или конкретной услуге.\n•\tНа методы контроля: методы, способы, приёмы проведения испытаний для обеспечения объективности результатов.\n•\tНа термины и определения: термины с определениями, содержащими необходимые и достаточные признаки понятия." },
            { q: "3. Формирование первичных требований", a: "Выявление потребностей заказчика, анализ бизнес-процессов, определение границ системы. Первичные требования формализуются в документе (видение проекта, черновик ТЗ) и служат основой для детального проектирования и разработки." },
            { q: "4. Документы при разработке и этапы ЖЦ", a: "По ГОСТ 19.102 :\n•\tТЗ — этап «Техническое задание».\n•\tЭскизный проект, технический проект — соответствующие этапы.\n•\tТекст программы, описание программы — этап «Рабочий проект».\n•\tПрограмма и методика испытаний — этап «Рабочий проект» (испытания).\n•\tРуководства (пользователя, программиста) — этап «Рабочий проект» (разработка документации).\nРазработка начинается на соответствующем этапе и заканчивается при сдаче проекта." },
            { q: "5. «Удобство использования»", a: "Способность ПО быть понятным, привлекательным и удобным для пользователя. Включает: изучаемость, управляемость, защищённость от ошибок пользователя, эстетику интерфейса, доступность." },
            { q: "6. Закон РФ о стандартизации", a: "Федеральный закон от 29.06.2015 № 162-ФЗ «О стандартизации в Российской Федерации»." },
            { q: "7. Модульный принцип программирования", a: "Разбиение программы на независимые модули с чёткими интерфейсами. Позволяет разрабатывать части параллельно, упрощает тестирование, отладку и повторное использование кода." },
            { q: "8. Виды программной документации", a: "По ГОСТ 19 :\n•\tВнутренняя: ТЗ, пояснительная записка, текст программы, описание программы, спецификация.\n•\tВнешняя (эксплуатационная): руководство пользователя, руководство программиста, руководство оператора, описание применения." },
            { q: "9. Внешнее и внутреннее качество", a: "Внешнее — измеряется по поведению системы (скорость, надёжность, удобство). Внутреннее — измеряется по коду (сложность, связность, читаемость) и влияет на внешнее в долгосрочной перспективе." },
            { q: "10. Унификация интерфейсов", a: "Приведение пользовательских интерфейсов к единому стилю (расположение элементов, цвета, шрифты, логика навигации) для снижения когнитивной нагрузки и ускорения обучения." },
            { q: "11. Система классификации и кодирования документов", a: "Используются общероссийские классификаторы (ОКПО, ОКТМО и др.) и системы кодирования, принятые в организации (например, по ГОСТ 19 для программных документов). Коды присваиваются для однозначной идентификации документа в системах электронного документооборота, обеспечения поиска и управления версиями." },
            { q: "12. Группы стандартов при разработке и сертификации ПО (сокращённо)", a: "1.\tОсновополагающие — терминология, принципы, порядок разработки. Цель: единство и взаимопонимание.\n2.\tНа продукцию (ПО) — требования к качеству, функциональности, безопасности. Цель: подтверждение соответствия при сертификации.\n3.\tНа процессы (ЖЦ) — регламентация этапов разработки и сопровождения (ГОСТ Р ИСО/МЭК 12207). Цель: управляемость процессов.\n4.\tНа методы контроля — методы испытаний ПО. Цель: объективность и воспроизводимость сертификации.\n5.\tНа совместимость — интероперабельность систем. Цель: интеграция компонентов." },
            { q: "13. Основные этапы разработки программных продуктов", a: "Анализ требований → Проектирование (архитектура, детальное проектирование) → Разработка (кодирование) → Тестирование → Внедрение → Сопровождение." },
            { q: "14. Схема разработки и использования программной документации", a: "Разработка (проектирование документа) → Согласование и утверждение → Внедрение (передача пользователю/эксплуатанту) → Использование по назначению → Актуализация (при изменении ПО или выявлении ошибок) → Снятие с эксплуатации (при устаревании)." },
            { q: "15. Требования к представлению результатов измерений в ИС", a: "Единство единиц измерения (СИ), заданная точность и погрешность, однозначный формат вывода, привязка к меткам времени, возможность машинной обработки, соответствие требованиям метрологии." },
            { q: "16. Свойство качества «Сопровождаемость»", a: "Способность ПО к модификации: исправлению ошибок, улучшению характеристик, адаптации к изменениям среды. Характеризуется: модульностью, повторно используемостью, анализируемостью, тестируемостью, легкостью изменения." },
            { q: "17. Нормативно-методическая база документирования", a: "ЕСПД (ГОСТ серии 19), стандарты серии 34 (для автоматизированных систем), международные стандарты (ISO/IEC), а также внутренние стандарты организации (СТО, инструкции по делопроизводству)." },
            { q: "18. Российские и международные стандарты ЖЦ ПО", a: "•\tГОСТ Р ИСО/МЭК 12207-2010 — процессы ЖЦ ПО (основной российский стандарт).\n•\tГОСТ 34 — автоматизированные системы (стадии создания, документы).\n•\tГОСТ 19 (ЕСПД) — программная документация.\n•\tISO/IEC 12207 — международный аналог 12207.\n•\tISO/IEC 25010 — модель качества ПО.\n•\tISO/IEC 15504 (SPICE) — оценка зрелости процессов." },
            { q: "19. SWOT: унификация vs новое изделие.", a: "•\tУнификация: \n•\tплюсы — дешевле, быстрее, проверенная надёжность, готовая поддержка, быстрый выход на рынок; \n•\tминусы — ограниченная гибкость, не учитывает уникальные требования; \n•\tриски — моральное устаревание, потеря конкурентного преимущества.\n•\tНовое изделие: \n•\tплюсы — точное соответствие требованиям, потенциал инноваций, захват ниши, патентная защита; \n•\tминусы — дорого и долго, высокий риск ошибок; \n•\tриски — провал проекта, неокупаемость инвестиций." },
            { q: "20. Разделы «Руководства пользователя»", a: "Введение (назначение и область применения), условия выполнения программы, выполнение программы (пошаговые инструкции), сообщения оператору (ошибки и реакция на них), возможные неисправности и способы их устранения." },
            { q: "21. Этапы сертификации программной продукции", a: "1.\tПодача заявки в орган по сертификации. 2. Анализ документов. 3. Отбор образцов (или предоставление доступа к ПО). 4. Проведение испытаний в аккредитованной лаборатории. 5. Анализ результатов и принятие решения. 6. Выдача сертификата соответствия." },
            { q: "22. «Мобильность»", a: "Способность ПО переноситься из одной среды в другую. Включает: адаптируемость, устанавливаемость, замещаемость." },
            { q: "23. Отличительные свойства и признаки документа", a: "Наличие носителя информации, юридическая сила (реквизиты: дата, номер, подпись), авторство, назначение (для фиксации и передачи информации), структурированность (разделы, пункты), однозначность восприятия." },
            { q: "24. Единство терминологии и методы его обеспечения", a: "Единство терминологии — использование стандартизированных терминов и определений для исключения двусмысленности. Методы: применение терминологических стандартов (ГОСТ), создание глоссариев и онтологий, строгое определение терминов в начале документа, ведение словаря терминов в ИС." },
            { q: "25. Преимущества и недостатки ЕСПД", a: "Плюсы: строгая унификация, облегчение передачи проекта, готовые формы.\nМинусы: избыточность для малых проектов, консервативность, ориентация на «водопадную» модель, не учитывает Agile." },
            { q: "26. ГОСТ Р ИСО/МЭК 12207-2010 (сокращённо)", a: "Определяет структуру процессов ЖЦ программных средств. Процессы делятся на:\n•\tОсновные: приобретение, поставка, разработка, эксплуатация, сопровождение.\n•\tПоддерживающие: документирование, управление конфигурацией, обеспечение качества, верификация, валидация, аудит, решение проблем.\n•\tОрганизационные: управление, создание инфраструктуры, усовершенствование, обучение." },
            { q: "27. Основные цели сертификации ПО, ИТ и услуг", a: "Подтверждение соответствия заявленным требованиям (качество, безопасность, функциональность), повышение доверия потребителей, создание условий для участия в тендерах и госзакупках, защита рынка от некачественной продукции, обеспечение интероперабельности." },
            { q: "28. Риски, связанные с реализацией проекта", a: "Технические: невыполнимость требований, сложность архитектуры, ошибки в коде. Управленческие: срыв сроков, превышение бюджета, нехватка ресурсов. Внешние: изменение законодательства, действия конкурентов, смена технологий. Риски требований: нечёткое ТЗ, постоянные изменения требований, непонимание между заказчиком и разработчиком." },
            { q: "29. Носители информации", a: "Магнитные: жёсткие диски (HDD), магнитные ленты. Оптические: CD, DVD, Blu-ray. Твердотельные: SSD, флеш-память. Бумажные: документы на бумаге." },
            { q: "30. Типы документов", a: "Текстовые (описания, инструкции), графические (схемы, чертежи), табличные (спецификации, ведомости), программные (листинги кода), комбинированные (содержат текст, графику и таблицы)." },
            { q: "31. Преимущества сертификата для производителя", a: "Повышение доверия заказчиков и потребителей, допуск к государственным закупкам (часто обязательно), подтверждение качества независимой экспертизой, конкурентное преимущество на рынке, снижение рисков рекламаций и претензий." },
            { q: "32. Основные задачи стандартизации", a: "Согласно ст. 3 162-ФЗ: содействие интеграции в мировую экономику, повышение качества и конкурентоспособности продукции, обеспечение безопасности жизни и здоровья, оптимизация номенклатуры, обеспечение единства измерений, устранение технических барьеров в торговле." },
            { q: "33. Унификация и её применение в программировании", a: "Унификация — приведение объектов к единой форме или системе для сокращения неоправданного многообразия. В программировании: использование единых API, библиотек, паттернов проектирования, единых форматов данных, единых стилей кодирования. Это снижает затраты на разработку и сопровождение." },
            { q: "34. Основные разделы «Технического задания» (сокращённо)", a: "Введение; основание для разработки; назначение; требования к программе (функциональные, к надёжности, к условиям эксплуатации); требования к документации; технико-экономические показатели; стадии и этапы; порядок контроля и приёмки." },
            { q: "35. «Эффективность»", a: "Связь между уровнем производительности и объёмом используемых ресурсов (время отклика, потребление памяти/ЦП) при заданных условиях." },
            { q: "36. Понятие технического документирования", a: "Процесс создания, оформления, согласования и обращения технических документов (чертежи, схемы, описания, ТЗ, спецификации), регламентируемый стандартами (ЕСКД, ЕСПД) для обеспечения их качества, однозначности и юридической силы." },
            { q: "37. Виды совместимости изделий", a: "Информационная (форматы данных, протоколы), программная (ОС, API, библиотеки), аппаратная (архитектура, интерфейсы), сетевая (протоколы связи). Для ПО наиболее важны информационная и программная совместимость (интероперабельность)." },
            { q: "38. Обязательная и добровольная сертификация", a: "Обязательная проводится, если объект включён в технические регламенты (например, средства защиты информации, связь). Цель — обеспечение безопасности. Добровольная — по инициативе производителя для подтверждения качества по национальным стандартам, повышения конкурентоспособности, допуска к тендерам." },
            { q: "39. Применение унификации при выделении и разработке программных модулей", a: "Выделение типовых функций в отдельные библиотеки/модули с едиными интерфейсами; использование единых стандартов именования, форматов данных и протоколов взаимодействия. Это позволяет повторно использовать модули в разных частях системы или в разных проектах, сокращая затраты." },
            { q: "40. Содержание разделов «Руководства администратора»", a: "Назначение и условия применения; настройка (конфигурация) системы; управление правами доступа пользователей; резервное копирование и восстановление данных; мониторинг работы системы; действия при сбоях." },
            { q: "41. Свойство качества «Функциональность»", a: "Способность ПО выполнять функции, удовлетворяющие заявленные и подразумеваемые потребности. Включает: функциональную полноту, правильность (точность результатов), способность к взаимодействию, защищённость." },
            { q: "42. Простые и сложные системы документирования", a: "Простые — состоят из одного документа (например, README-файл или краткая инструкция). Сложные — иерархия взаимосвязанных документов (ТЗ, проектная, эксплуатационная документация), связанных ссылками, версиями и процедурами управления изменениями (ЕСПД)." },
            { q: "43. Цели и методы стандартизации при рыночных отношениях", a: "Цели: переход от жёсткого администрирования к добровольному применению (кроме требований безопасности), защита интересов потребителя, обеспечение совместимости и взаимозаменяемости. Методы: широкое использование международных стандартов, достижение консенсуса при разработке, участие бизнеса в технических комитетах." },
            { q: "44. Функциональные и эксплуатационные требования (сокращённо)", a: "Функциональные — что система должна делать (действия, расчёты, обработка данных). Эксплуатационные — условия работы (персонал, обслуживание, режим, надёжность и безопасность в эксплуатации). Различие: первые описывают поведение, вторые — условия и среду функционирования." },
            { q: "45. Органы сертификации программных средств в России", a: "Аккредитованные органы по сертификации (юридические лица), имеющие аттестат аккредитации в национальной системе (Росаккредитация). Испытания проводят аккредитованные испытательные лаборатории." },
            { q: "46. Основные разделы «Руководства программиста»", a: "Назначение и условия применения программы; характеристики программы; обращение к программе (способ вызова); входные и выходные данные; сообщения (ошибки и реакция на них)." },
            { q: "47. «Надёжность»", a: "Способность выполнять требуемые функции в заданных условиях в течение заданного периода. Включает: безотказность, восстанавливаемость, готовность." },
            { q: "48. Способы и средства документирования", a: "Способы: традиционный (бумажный) и автоматизированный (с использованием САПР, текстовых редакторов, систем управления версиями, Wiki). Средства: шаблоны и формы документов, стандарты (ГОСТ, ЕСПД), CASE-средства, системы электронного документооборота." },
            { q: "49. Разница между функциональными и системными требованиями", a: "Функциональные описывают, что система должна делать (конкретные функции, действия, расчёты). Системные описывают, какими свойствами должна обладать система в целом: производительность, надёжность, ограничения по ресурсам, требования к интеграции, масштабируемость." },
            { q: "50. Зачем нужна спецификация?", a: "Спецификация — официальный документ, фиксирующий требования, архитектуру, детали реализации и/или состав компонентов. Она обеспечивает однозначное понимание между заказчиком и разработчиком, служит основой для управления изменениями и для тестирования, а также является частью документации при сдаче проекта." }
        ];

        // ===== Вкладки =====
        const tabs = document.querySelectorAll('.tab');
        const contents = document.querySelectorAll('.tab-content');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                contents.forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        // ===== Хелпер: создание карточки вопроса =====
        function createCard(item, showNumber) {
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';

            const questionText = document.createElement('span');
            questionText.className = 'question-text';
            questionText.textContent = showNumber ? item.q : stripNumber(item.q);

            const toggle = document.createElement('span');
            toggle.className = 'toggle';
            toggle.textContent = '+';

            header.appendChild(questionText);
            header.appendChild(toggle);

            const answer = document.createElement('div');
            answer.className = 'answer';
            answer.textContent = item.a;

            header.addEventListener('click', () => {
                const isOpen = answer.classList.toggle('open');
                toggle.textContent = isOpen ? '−' : '+';
            });

            card.appendChild(header);
            card.appendChild(answer);
            return card;
        }

        function stripNumber(q) {
            return q.replace(/^\d+\.\s*/, '');
        }

        // ===== Режим "Все вопросы" =====
        const allContainer = document.getElementById('allQuestions');
        qa.forEach(item => allContainer.appendChild(createCard(item, true)));

        // ===== Режим "Случайные 5" =====
        const randomContainer = document.getElementById('randomQuestions');
        const newRandomBtn = document.getElementById('newRandomBtn');

        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function renderRandom() {
            randomContainer.innerHTML = '';
            const picked = shuffle(qa).slice(0, 5);
            picked.forEach(item => randomContainer.appendChild(createCard(item, false)));
        }

        newRandomBtn.addEventListener('click', renderRandom);
        renderRandom();

        // ===== Режим "По порядку" =====
        const cycleContainer = document.getElementById('cycleQuestions');
        const cycleProgress = document.getElementById('cycleProgress');
        const newCycleBtn = document.getElementById('newCycleBtn');

        let cycleQueue = [];
        let cycleTotal = qa.length;

        function initCycle() {
            cycleQueue = shuffle(qa);
            renderCycle();
        }

        function renderCycle() {
            cycleContainer.innerHTML = '';
            if (cycleQueue.length === 0) {
                cycleProgress.textContent = 'Все вопросы пройдены! Нажмите кнопку, чтобы начать заново.';
                return;
            }
            const batch = cycleQueue.slice(0, 5);
            const remaining = cycleQueue.length - batch.length;
            cycleProgress.textContent = `Осталось в очереди после этого набора: ${remaining} из ${cycleTotal}`;
            batch.forEach(item => cycleContainer.appendChild(createCard(item, false)));
        }

        newCycleBtn.addEventListener('click', () => {
            if (cycleQueue.length === 0) {
                initCycle();
            } else {
                // убираем текущие 5 и показываем следующие
                cycleQueue = cycleQueue.slice(5);
                if (cycleQueue.length === 0) {
                    // если закончились — сбрасываем
                    initCycle();
                } else {
                    renderCycle();
                }
            }
        });

        initCycle();
    </script>
</body>
</html>
